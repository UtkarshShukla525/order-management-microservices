server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/products/**
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**

eureka:
  instance:
    # Register by IP so lookups do not depend on the machine's hostname resolving.
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

server:
  port: 8082

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:h2:mem:orderdb
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true

eureka:
  instance:
    # Register by IP so lookups do not depend on the machine's hostname resolving.
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
